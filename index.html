<!DOCTYPE html>
<html lang="en" class="scroll-smooth dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabir Ali | Full-Stack Engineer — Systems & Digital Experiences</title>
    <meta name="description" content="Portfolio of Sabir Ali, Full-Stack Engineer specializing in scalable web systems, modern MERN architectures, and high-performance digital experiences.">
    <meta name="theme-color" content="#050505">
    <meta name="google-site-verification" content="yNZuE0nLFCSiYJOdClvdXz-y5ITwWYfB_BmtFiJKQtU">

    <!-- Favicon: Monogram S SVG -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%23050505%22/><text x=%2250%22 y=%2268%22 font-family=%22Inter, -apple-system, sans-serif%22 font-size=%2258%22 font-weight=%22900%22 fill=%22%23ffffff%22 text-anchor=%22middle%22>S</text></svg>">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Geist+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-base: #050505;
            --bg-surface: #0e0e0e;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --border-subtle: rgba(255, 255, 255, 0.08);
        }
        html {
            background-color: #050505;
            color: #ffffff;
            color-scheme: dark;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
            background-color: #050505;
            color: #ffffff;
            margin: 0;
            padding: 0;
        }
        .mono {
            font-family: 'Geist Mono', monospace;
        }

        /* Custom Scrollbar - Monochrome */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #050505;
        }
        ::-webkit-scrollbar-thumb {
            background: #222222;
            border-radius: 9999px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #444444;
        }

        html.lenis, html.lenis body {
            height: auto;
        }
        .lenis.lenis-smooth {
            scroll-behavior: auto !important;
        }

        /* Subtle subtle ambient noise texture and vignette */
        .ambient-mesh {
            background-image:
                radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.04) 0%, transparent 60%),
                radial-gradient(circle at 100% 100%, rgba(255, 255, 255, 0.02) 0%, transparent 40%);
        }

        ::selection {
            background: #ffffff;
            color: #050505;
        }
    </style>
</head>
<body class="bg-[#050505] text-white antialiased selection:bg-white selection:text-black">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root" class="min-h-screen bg-[#050505]"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
