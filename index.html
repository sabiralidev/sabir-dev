<!DOCTYPE html>
<html lang="en" class="scroll-smooth dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preload" as="image" href="/Sabir.png" fetchpriority="high">

    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Geist+Mono:wght@400;500;700&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Geist+Mono:wght@400;500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Geist+Mono:wght@400;500;700&display=swap" rel="stylesheet"></noscript>

    <style>
        :root {
            --bg-base: #050505;
            --bg-surface: #0e0e0e;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --border-subtle: rgba(255, 255, 255, 0.08);
        }
        html {
            background-color: #050505;
            color: #ffffff;
            color-scheme: dark;
        }
        body {
            font-family: 'Inter', sans-serif;
            font-optical-sizing: auto;
            font-variation-settings: "wdth" 100;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
            background-color: #050505;
            color: #ffffff;
            margin: 0;
            padding: 0;
        }
        .boot-preloader {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: grid;
            place-items: center;
            overflow: hidden;
            background: #0A0A0B;
        }
        .boot-preloader-glow {
            position: absolute;
            width: min(70vw, 34rem);
            aspect-ratio: 1;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(210,216,224,.12), rgba(158,163,168,.05) 36%, transparent 72%);
            filter: blur(24px);
        }
        .boot-preloader-mark {
            position: relative;
            width: clamp(5rem, 16vw, 8rem);
            z-index: 1;
        }
        .mono {
            font-family: 'Geist Mono', monospace;
        }

        /* Custom Scrollbar - Monochrome */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #050505;
        }
        ::-webkit-scrollbar-thumb {
            background: #222222;
            border-radius: 9999px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #444444;
        }

        html.lenis, html.lenis body {
            height: auto;
        }
        .lenis.lenis-smooth {
            scroll-behavior: auto !important;
        }

        /* Subtle subtle ambient noise texture and vignette */
        .ambient-mesh {
            background-image:
                radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.04) 0%, transparent 60%),
                radial-gradient(circle at 100% 100%, rgba(255, 255, 255, 0.02) 0%, transparent 40%);
        }

    </style>
</head>
<body class="bg-[#050505] text-white antialiased">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="preloader-shell" class="boot-preloader" aria-hidden="true">
        <div class="boot-preloader-glow"></div>
        <svg class="boot-preloader-mark" viewBox="0 0 100 100" fill="none" aria-hidden="true">
            <defs>
                <linearGradient id="boot-silver" x1="20%" y1="0%" x2="80%" y2="100%">
                    <stop offset="0%" stop-color="#F5F6F8"/>
                    <stop offset="52%" stop-color="#9EA3A8"/>
                    <stop offset="100%" stop-color="#E8EAEC"/>
                </linearGradient>
            </defs>
            <path d="M67 20H43C33 20 27 26 27 36C27 44 32 48 42 51L58 55C68 58 73 63 73 72C73 82 66 88 55 88H31V75H55C59 75 61 74 61 71C61 68 59 67 54 65L38 61C22 57 15 49 15 36C15 19 26 8 43 8H67V20Z" fill="url(#boot-silver)"/>
        </svg>
    </div>
    <div id="root" class="min-h-screen bg-[#050505]"></div>
    <script>
        (() => {
            const shell = document.getElementById('preloader-shell');
            const key = 'sabir-portfolio-preloader-page';
            const token = String(performance.timeOrigin);
            let shouldShow = true;
            try {
                if (sessionStorage.getItem(key) === token) shouldShow = false;
                else if (shouldShow) sessionStorage.setItem(key, token);
            } catch {
                // Continue with the preloader when session storage is unavailable.
            }
            if (shell) {
                shell.dataset.showIntro = String(shouldShow);
                if (!shouldShow) shell.remove();
            }
        })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
