<!DOCTYPE html>
<html lang="en" class="scroll-smooth dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabir Ali | Full-Stack Engineer | Systems & Digital Experiences</title>
    <meta name="description" content="Portfolio of Sabir Ali, Full-Stack Engineer specializing in scalable web systems, modern MERN architectures, and high-performance digital experiences.">
    <meta name="theme-color" content="#050505">
    <meta name="google-site-verification" content="yNZuE0nLFCSiYJOdClvdXz-y5ITwWYfB_BmtFiJKQtU">
    <link rel="preload" as="image" href="/Sabir.png" fetchpriority="high">

    <link rel="icon" type="image/svg+xml" href="/favicon.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Geist+Mono:wght@400;500;700&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Geist+Mono:wght@400;500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Geist+Mono:wght@400;500;700&display=swap" rel="stylesheet"></noscript>

    <style>
        :root {
            --bg-base: #050505;
            --bg-surface: #0e0e0e;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --border-subtle: rgba(255, 255, 255, 0.08);
        }
        html {
            background-color: #050505;
            color: #ffffff;
            color-scheme: dark;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
            background-color: #050505;
            color: #ffffff;
            margin: 0;
            padding: 0;
        }
        .mono {
            font-family: 'Geist Mono', monospace;
        }

        /* Custom Scrollbar - Monochrome */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #050505;
        }
        ::-webkit-scrollbar-thumb {
            background: #222222;
            border-radius: 9999px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #444444;
        }

        html.lenis, html.lenis body {
            height: auto;
        }
        .lenis.lenis-smooth {
            scroll-behavior: auto !important;
        }

        /* Subtle subtle ambient noise texture and vignette */
        .ambient-mesh {
            background-image:
                radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.04) 0%, transparent 60%),
                radial-gradient(circle at 100% 100%, rgba(255, 255, 255, 0.02) 0%, transparent 40%);
        }

    </style>
</head>
<body class="bg-[#050505] text-white antialiased">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root" class="min-h-screen bg-[#050505]"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
